name: Java Docker CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  docker-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test database
        run: |
          docker compose -f docker-compose.test.yml up -d --build db-test

          echo "Waiting for PostgreSQL..."

          for i in {1..20}; do
            if docker exec detective-manager-db-test pg_isready -U test_user -d detective_test_db; then
              echo "PostgreSQL is ready!"
              break
            fi

            sleep 5
          done

      - name: Build application test container
        run: |
          docker compose -f docker-compose.test.yml build detective-manager-test

      - name: Run tests
        run: |
          docker compose -f docker-compose.test.yml run --rm detective-manager-test

      - name: Shutdown containers
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v