name: Java Docker CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  docker-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test database
        run: |
          docker compose -f docker-compose.test.yml up -d db-test

          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do
            docker exec detective-manager-db-test pg_isready -U test_user -d detective_test_db && exit 0
            sleep 2
          done

          echo "DB not ready"
          exit 1

      - name: Build test image
        run: |
          docker compose -f docker-compose.test.yml build detective-manager-test

      - name: Run format + tests + coverage
        run: |
          docker compose -f docker-compose.test.yml run --rm detective-manager-test \
          mvn -B spotless:check clean verify jacoco:check

      - name: Shutdown containers
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v