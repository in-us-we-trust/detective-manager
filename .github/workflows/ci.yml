name: Java Docker CI with Coverage

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  docker-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start test database
        run: |
          docker compose -f docker-compose.test.yml up -d db-test

          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do
            if docker exec detective-manager-db-test pg_isready -U test_user -d detective_test_db; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            sleep 2
          done

          echo "PostgreSQL not ready"
          exit 1

      - name: Build test container
        run: |
          docker compose -f docker-compose.test.yml build detective-manager-test

      - name: Run Spotless check
        run: |
          docker compose -f docker-compose.test.yml run --rm detective-manager-test \
          mvn -B spotless:check

      - name: Run tests with coverage
        run: |
          docker compose -f docker-compose.test.yml run --rm detective-manager-test \
          mvn -B clean verify

      - name: Shutdown Docker Compose
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v