name: CD (Deploy Detective Manager to Cloud Run)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}

  SERVICE: detective-manager

  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tp-hogar-seguro/detective-manager

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build production Docker image
        run: |
          docker build \
            -f Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 1 \
            --cpu-throttling \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod" \
            --set-env-vars "MULTIPART_MAX_FILE_SIZE=30MB" \
            --set-env-vars "MULTIPART_MAX_REQUEST_SIZE=31MB" \
            --set-env-vars "DB_URL=${{ secrets.DB_URL }}" \
            --set-env-vars "DB_USERNAME=${{ secrets.DB_USERNAME }}" \
            --set-env-vars "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars "ML_SERVICE_BASE_URL=${{ secrets.ML_SERVICE_BASE_URL }}" \
            --set-env-vars "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
            --set-env-vars "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" \
            --set-env-vars "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" \
            --set-env-vars "RABBIT_URL=${{ secrets.RABBIT_URL }}" \
            --set-env-vars "RABBIT_QUEUE=${{ secrets.RABBIT_QUEUE }}"
