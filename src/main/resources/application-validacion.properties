# Exclusivo de la rama validacion: no usar este perfil en producción.
# H2 vive dentro de la JVM. Cada arranque inicia una base vacía.
spring.datasource.url=jdbc:h2:mem:detective_validation;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# No se crean clientes AMQP ni beans de Cloudinary en este perfil.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Todos los analizadores conservan sus llamadas reales al ML.
ml.service.base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}

validation.media.directory=${VALIDATION_MEDIA_DIRECTORY:./validation-data/images}
validation.notifications.file=${VALIDATION_NOTIFICATIONS_FILE:./validation-data/notifications.jsonl}

# Evita volcar los archivos y vectores completos durante las mediciones.
logging.level.com.is2.detective_manager.configuration.RestTemplateConfig=WARN
