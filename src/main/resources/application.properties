spring.application.name=detective-manager
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
springdoc.swagger-ui.path=/docs
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${PORT:8087}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false

ml.service.base-url=${ML_SERVICE_BASE_URL}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.rabbitmq.addresses=${RABBIT_URL:amqp://guest:guest@localhost:5672/}
rabbitmq.notifications.exchange=${RABBITMQ_NOTIFICATIONS_EXCHANGE:}
rabbitmq.notifications.routing-key=${RABBIT_QUEUE:doorbell-notifications}
rabbitmq.notifications.publish.max-attempts=${RABBITMQ_NOTIFICATIONS_PUBLISH_MAX_ATTEMPTS:3}
rabbitmq.notifications.publish.retry-delay-ms=${RABBITMQ_NOTIFICATIONS_PUBLISH_RETRY_DELAY_MS:500}
