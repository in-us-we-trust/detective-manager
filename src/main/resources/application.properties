spring.application.name=detective-manager
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
springdoc.swagger-ui.path=/docs
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${PORT:8088}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:100MB}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false

ml.service.base-url=${ML_SERVICE_BASE_URL}

# Video behavior thresholds. Initial values are conservative and externally adjustable.
orchestrator.video.minimum-confidence=${VIDEO_MINIMUM_CONFIDENCE:0.35}
orchestrator.video.tracking-gap-tolerance-seconds=${VIDEO_TRACKING_GAP_TOLERANCE_SECONDS:0.75}
orchestrator.video.id-stitch-maximum-gap-seconds=${VIDEO_ID_STITCH_MAXIMUM_GAP_SECONDS:1.0}
orchestrator.video.id-stitch-maximum-distance-pct=${VIDEO_ID_STITCH_MAXIMUM_DISTANCE_PCT:5.0}
orchestrator.video.id-stitch-maximum-area-change-ratio=${VIDEO_ID_STITCH_MAXIMUM_AREA_CHANGE_RATIO:0.35}
orchestrator.video.prolonged-presence-seconds=${VIDEO_PROLONGED_PRESENCE_SECONDS:20.0}
orchestrator.video.long-stop-seconds=${VIDEO_LONG_STOP_SECONDS:10.0}
orchestrator.video.stationary-speed-pct-per-second=${VIDEO_STATIONARY_SPEED_PCT_PER_SECOND:1.0}
orchestrator.video.motion-window-seconds=${VIDEO_MOTION_WINDOW_SECONDS:0.75}
orchestrator.video.direction-minimum-displacement-pct=${VIDEO_DIRECTION_MINIMUM_DISPLACEMENT_PCT:2.0}
orchestrator.video.direction-change-angle-degrees=${VIDEO_DIRECTION_CHANGE_ANGLE_DEGREES:70.0}
orchestrator.video.repeated-direction-changes=${VIDEO_REPEATED_DIRECTION_CHANGES:3}
orchestrator.video.return-minimum-excursion-pct=${VIDEO_RETURN_MINIMUM_EXCURSION_PCT:10.0}
orchestrator.video.return-maximum-distance-pct=${VIDEO_RETURN_MAXIMUM_DISTANCE_PCT:4.0}
orchestrator.video.return-minimum-duration-seconds=${VIDEO_RETURN_MINIMUM_DURATION_SECONDS:3.0}
orchestrator.video.approach-minimum-duration-seconds=${VIDEO_APPROACH_MINIMUM_DURATION_SECONDS:2.0}
orchestrator.video.approach-minimum-area-increase-ratio=${VIDEO_APPROACH_MINIMUM_AREA_INCREASE_RATIO:0.25}
orchestrator.video.approach-minimum-log-area-rate-per-second=${VIDEO_APPROACH_MINIMUM_LOG_AREA_RATE_PER_SECOND:0.04}
orchestrator.video.approach-minimum-sustained-ratio=${VIDEO_APPROACH_MINIMUM_SUSTAINED_RATIO:0.65}
orchestrator.video.fast-approach-minimum-area-increase-ratio=${VIDEO_FAST_APPROACH_MINIMUM_AREA_INCREASE_RATIO:0.50}
orchestrator.video.fast-approach-minimum-log-area-rate-per-second=${VIDEO_FAST_APPROACH_MINIMUM_LOG_AREA_RATE_PER_SECOND:0.12}
orchestrator.video.multiple-people-minimum-seconds=${VIDEO_MULTIPLE_PEOPLE_MINIMUM_SECONDS:2.0}
orchestrator.video.frame-edge-margin-pct=${VIDEO_FRAME_EDGE_MARGIN_PCT:8.0}
orchestrator.video.video-boundary-tolerance-seconds=${VIDEO_BOUNDARY_TOLERANCE_SECONDS:0.75}
orchestrator.video.distance-synchronization-tolerance-seconds=${VIDEO_DISTANCE_SYNCHRONIZATION_TOLERANCE_SECONDS:0.15}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.rabbitmq.addresses=${RABBIT_URL:amqp://guest:guest@localhost:5672/}
rabbitmq.notifications.exchange=${RABBITMQ_NOTIFICATIONS_EXCHANGE:}
rabbitmq.notifications.routing-key=${RABBIT_QUEUE:doorbell-notifications}
rabbitmq.notifications.publish.max-attempts=${RABBITMQ_NOTIFICATIONS_PUBLISH_MAX_ATTEMPTS:3}
rabbitmq.notifications.publish.retry-delay-ms=${RABBITMQ_NOTIFICATIONS_PUBLISH_RETRY_DELAY_MS:500}
