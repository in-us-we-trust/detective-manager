spring.datasource.url=jdbc:postgresql://db-test:5432/detective_test_db
spring.datasource.username=test_user
spring.datasource.password=test_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.main.banner-mode=off
spring.jpa.open-in-view=false
logging.level.root=WARN
logging.level.com.is2.detective_manager=OFF

ml.service.base-url=http://ml-service-test
users-manager.base-url=http://users-manager-test

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
